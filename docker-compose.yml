services:
  postgres:
    image: postgres:16-alpine
    container_name: buslink-postgres
    env_file:
      - infrastructure/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - buslink_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: buslink-pgadmin
    env_file:
      - infrastructure/.env
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - buslink_network
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:

networks:
  buslink_network:
    driver: bridge
