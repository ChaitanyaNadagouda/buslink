# ===== Application =====
spring.application.name=BusLink

# ===== Database (PostgreSQL) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# ===== JWT =====
jwt.secret=${JWT_SECRET}
# 15 min.
jwt.access-token-expiry-ms=900000
# 7 days.
jwt.refresh-token-expiry-ms=604800000

# ===== Wallet =====
wallet.overdraft-limit=100.00

# ===== Ticket =====
# Issue-retry dedup window.
ticket.idempotency.ttl-hours=24
# Unpaid-ISSUED cutoff age.
ticket.expiry.threshold-hours=24
# Expiry sweep frequency - 1 hr.
ticket.expiry.check-interval-ms=3600000

# ===== Offline Sync =====
# FAILED retry frequency - 5 min.
sync.retry-interval-ms=300000
# Scheduler stops retrying a FAILED event after this many failures (10 x 5 min = 50 min); re-upload still works.
sync.max-retry-attempts=10
# Replay/clock-tamper guard.
sync.max-sync-age-days=7
# Phone-vs-server clock drift allowed: future issuedAt + passenger QR exp check.
sync.clock-skew-tolerance-minutes=5

# ===== Idempotency Key Cleanup =====
# Sweep frequency - 24 hr.
idempotency.cleanup.interval-ms=86400000

# ===== Payment Gateway (Razorpay) =====
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

# ===== Cache (Redis) =====
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
# Dead RedisConfig's custom manager wins - 1 hr.
spring.cache.redis.time-to-live=3600000
